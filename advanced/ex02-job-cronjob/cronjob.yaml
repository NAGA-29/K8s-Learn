apiVersion: batch/v1
kind: CronJob
metadata:
  name: report-demo
spec:
  # 毎分実行（学習用。本番では適切な間隔にする）
  schedule: "*/1 * * * *"
  # 前回の実行が終わっていない場合は新しい実行をスキップする。
  # 多重起動すると困るバッチ（集計、バックアップ等）では必須の設定
  concurrencyPolicy: Forbid
  # 履歴として残す Job の数
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  # スケジュール時刻から100秒以内に起動できなければスキップする
  startingDeadlineSeconds: 100
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["/bin/sh", "-c"]
              args:
                - 'echo "定期レポートを生成しました: $(date)"'
              resources:
                requests:
                  cpu: "50m"
                  memory: "16Mi"
                limits:
                  cpu: "100m"
                  memory: "32Mi"
