apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-api
  namespace: mini-app
  labels:
    app: simple-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-api
  template:
    metadata:
      labels:
        app: simple-api
    spec:
      containers:
        - name: simple-api
          image: simple-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          # --- 意図的に壊した readinessProbe ---
          # 存在しないパス /healthz-nonexistent を指定している。
          # これにより readinessProbe が常に失敗し、
          # Pod は Endpoints から除外される。
          readinessProbe:
            httpGet:
              path: /healthz-nonexistent
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
