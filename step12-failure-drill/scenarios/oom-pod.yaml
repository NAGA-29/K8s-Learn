apiVersion: v1
kind: Pod
metadata:
  name: oom-demo
  namespace: mini-app
spec:
  containers:
    - name: oom
      image: alpine:3.19
      command: ["/bin/sh", "-c"]
      # /dev/shm は tmpfs（メモリ上のファイルシステム）であり、
      # ここへの書き込みはコンテナのメモリ使用量としてカウントされる。
      # 64MiB を書き込もうとするため、limits の 32Mi を超えた時点で
      # OOM Killer によりコンテナが強制終了される（OOMKilled）
      args: ["dd if=/dev/zero of=/dev/shm/fill bs=1M count=64"]
      resources:
        requests:
          memory: "16Mi"
        limits:
          memory: "32Mi"
