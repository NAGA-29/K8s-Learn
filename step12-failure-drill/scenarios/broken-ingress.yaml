apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mini-app-ingress
  namespace: mini-app
spec:
  ingressClassName: nginx
  rules:
    - host: mini-app.local
      http:
        paths:
          # --- 意図的に壊した backend ---
          # 正しくは simple-api / simple-web だが、存在しない Service 名を指定している。
          # これにより Ingress Controller がバックエンドを解決できない。
          #
          # 確認方法:
          #   kubectl describe ingress mini-app-ingress -n mini-app
          #   → backend に <error: endpoints "..." not found> 等が表示される
          #
          # 復旧方法:
          #   kubectl apply -f ../step11-mini-architecture/ingress.yaml
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: simple-api-typo
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-typo
                port:
                  number: 80
