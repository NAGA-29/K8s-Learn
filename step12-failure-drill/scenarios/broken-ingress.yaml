apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: broken-ingress
  namespace: mini-app
spec:
  rules:
    - host: mini-app.local
      http:
        paths:
          - path: /broken
            pathType: Prefix
            backend:
              service:
                # 意図的に存在しないService名
                name: simple-api-wrong  # 正しくは simple-api
                port:
                  number: 8080
