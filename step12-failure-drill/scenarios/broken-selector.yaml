apiVersion: v1
kind: Service
metadata:
  name: simple-api
  namespace: mini-app
  labels:
    app: simple-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  # --- 意図的に壊した selector ---
  # 正しくは app: simple-api だが、typo を入れている。
  # これにより Endpoints が空になり、トラフィックが流れない。
  #
  # 確認方法:
  #   kubectl get endpoints simple-api -n mini-app
  #   → Endpoints: <none> と表示される
  #
  # 復旧方法:
  #   kubectl apply -f ../../step11-multi-resource-app/manifests/api/service.yaml
  selector:
    app: simple-api-typo
