apiVersion: v1
kind: Service
metadata:
  name: simple-api
  namespace: mini-app
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  # --- 意図的に壊した selector ---
  # 正しくは app: simple-api だが、typo を入れている。
  # これにより Endpoints が空になり、トラフィックが流れない。
  #
  # 確認方法:
  #   kubectl get endpoints simple-api -n mini-app
  #   → ENDPOINTS が <none> と表示される
  #
  # 復旧方法:
  #   kubectl apply -f ../step11-mini-architecture/api.yaml
  selector:
    app: simple-api-typo
