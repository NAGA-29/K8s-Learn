apiVersion: apps/v1
kind: Deployment
metadata:
  name: simple-web
  namespace: mini-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: simple-web
  template:
    metadata:
      labels:
        app: simple-web
    spec:
      containers:
        - name: web
          image: simple-web:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: simple-web
  namespace: mini-app
spec:
  selector:
    app: simple-web
  ports:
    - port: 80
      targetPort: 80
