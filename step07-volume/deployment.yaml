apiVersion: apps/v1
kind: Deployment
metadata:
  name: volume-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volume-demo
  template:
    metadata:
      labels:
        app: volume-demo
    spec:
      containers:
        - name: app
          image: nginx:1.25
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp/scratch
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Pod started at $(date)" >> /data/log.txt
              nginx -g 'daemon off;'
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: tmp
          emptyDir: {}
