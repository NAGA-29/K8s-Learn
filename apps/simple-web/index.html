<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K8s Learning - Web Frontend</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
      color: #333;
      background: #f5f5f5;
    }
    h1 {
      color: #326ce5;
    }
    button {
      background: #326ce5;
      color: #fff;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #2756b3;
    }
    #result {
      margin-top: 20px;
      padding: 16px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 4px;
      min-height: 40px;
      white-space: pre-wrap;
      font-family: monospace;
    }
    .error {
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <h1>K8s Learning - Web Frontend</h1>
  <p>API からメッセージ・訪問カウント（Redis）を取得します。</p>
  <button id="fetchBtn">Fetch Message</button>
  <button id="countBtn">Fetch Count</button>
  <div id="result">ボタンを押してください</div>

  <script>
    function callApi(path) {
      var resultDiv = document.getElementById("result");
      resultDiv.textContent = "Loading...";
      resultDiv.className = "";

      fetch(path)
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          resultDiv.textContent = JSON.stringify(data, null, 2);
        })
        .catch(function (err) {
          resultDiv.textContent = "Error: " + err.message;
          resultDiv.className = "error";
        });
    }

    document.getElementById("fetchBtn").addEventListener("click", function () {
      callApi("/api/message");
    });
    document.getElementById("countBtn").addEventListener("click", function () {
      callApi("/api/count");
    });
  </script>
</body>
</html>
